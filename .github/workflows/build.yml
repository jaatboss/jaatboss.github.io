name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A34D5A: ${{ secrets.A34D5A }}
          BD21F9: ${{ secrets.BD21F9 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A34D5A', '')
          env_b = os.environ.get('BD21F9', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 0c648b12b519984eb716a8b88fc47b085f4a7aae90 -->', env_a)
          if env_b:
              result = result.replace('<!-- 095a58d75da76d24 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
